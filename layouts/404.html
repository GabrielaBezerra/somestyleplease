{{ define "main" }}
    <div class="back-and-meta">
        {{ partial "back_link.html" . }}
        {{ with .Translations }}
            <div class="post-meta">
                {{ range . }}
                    <a href="{{ .Permalink }}">{{ .Language.Label }}</a>
                {{ end }}
            </div>
        {{ end }}
    </div>

    <header>
        <h1>{{ i18n "404.title" }}</h1>
        <p>{{ i18n "404.message" }}</p>
    </header>

    <script>
      (function () {
        var path = window.location.pathname || '/';
        if (path.indexOf('/pt/') === 0 && !path.endsWith('/pt/404.html')) {
          window.location.replace('/pt/404.html');
        }
      })();
    </script>
{{ end }}
